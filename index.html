      /* First-screen faces inline (no fonts.css round trip before text can paint). Inter swaps over a metric-matched local fallback, so the
         LCP text paints on the first frame and the swap moves nothing; Michroma (headline) stays block, it is preloaded and small. */

      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/Inter-9c8c4a6d.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/Inter-9c8c4a6d.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/Inter-9c8c4a6d.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/Inter-9c8c4a6d.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter Fallback'; src: local('Arial'), local('Helvetica'), local('Liberation Sans'); size-adjust: 107.4%; ascent-override: 90.2%; descent-override: 22.48%; line-gap-override: 0%; }
      @font-face { font-family: 'Michroma'; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/Michroma-bf05d944.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

    <style>
      body {
        background-color: #faf5ea;
        color: #0c0b09;
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dark body {
        background-color: #050504;
        color: #faf7f0;
      }
      .glass-card {
        background: rgba(250, 245, 234, 0.62);
        backdrop-filter: blur(18px) saturate(1.25);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
        border: 1px solid rgba(200, 181, 143, 0.38);
        box-shadow: 0 8px 32px rgba(12, 11, 9, 0.08), inset 0 1px 0 rgba(255,255,255,0.45);
      }
      .dark .glass-card {
        background: rgba(12, 11, 9, 0.52);
        border: 1px solid rgba(200, 181, 143, 0.28);
        box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
      }
      :root {
        --nav-dock-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
        --nav-dock-height: 3.5rem;
        --footer-nav-clearance: calc(var(--nav-dock-bottom) + var(--nav-dock-height) + 2.75rem);
      }
      @media (min-width: 640px) {
        :root {
          --nav-dock-bottom: max(1.25rem, env(safe-area-inset-bottom, 0px));
          --nav-dock-height: 3.75rem;
        }
      }
      .nav-floating {
        position: fixed;
        bottom: var(--nav-dock-bottom);
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Reserve space so page CTAs are never covered by the dock */
      #root, main, .fourcee-main-clearance {
        padding-bottom: 0;
      }
      .dock-safe-pad {
        padding-bottom: var(--footer-nav-clearance);
      }
      /* Keep terms / disclaimer above the fixed bottom dock */
      .footer-terms-clearance {
        padding-bottom: var(--footer-nav-clearance);
      }
      .shimmer-text {
        background: linear-gradient(to right, #0c0b09 20%, #b8ae9e 40%, #b8ae9e 60%, #0c0b09 80%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
      }
      .dark .shimmer-text {
        background: linear-gradient(to right, #faf7f0 20%, #b8ae9e 40%, #b8ae9e 60%, #faf7f0 80%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes shine {
        to { background-position: 200% center; }
      }
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        background: #1a1714 !important;
        border-radius: 10px;
        opacity: 1;
      }
      input[type=range]::-moz-range-track {
        width: 100%;
        height: 8px;
        background: #1a1714 !important;
        border-radius: 10px;
      }
      .dark input[type=range]::-webkit-slider-runnable-track {
        background: #3a342b;
      }
      input[type=range]::-webkit-slider-thumb {
        height: 24px;
        width: 24px;
        border-radius: 50%;
        background: #0c0b09;
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -9px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        border: 2px solid white;
      }
      .dark input[type=range]::-webkit-slider-thumb {
        background: #faf7f0;
        border: 2px solid #0c0b09;
      }
      /* Side menu / panels: coherent black + beige — NO big plate image (was beige/grey split) */
      .fourcee-surface-bg {
        background-color: #faf5ea;
        background-image:
          linear-gradient(165deg, #faf5ea 0%, #f3ebe0 48%, #e8dcc8 100%);
        background-size: cover;
        background-repeat: no-repeat;
      }
      .dark .fourcee-surface-bg {
        background-color: #0c0b09;
        background-image:
          linear-gradient(165deg, #0c0b09 0%, #1a1712 55%, #050504 100%);
      }
      /* Dark ribbed wash — problem / cinematic sections */
      .fourcee-ribbed-wash {
        background-color: #050504;
        background-image:
          linear-gradient(180deg, rgba(5, 5, 4, 0.55) 0%, rgba(5, 5, 4, 0.72) 50%, rgba(5, 5, 4, 0.88) 100%),
          url('assets/mobile-background.jpg');
        background-size: cover, cover;
        background-position: center, center;
        background-repeat: no-repeat, no-repeat;
      }
      @media (min-width: 768px) {
        .fourcee-ribbed-wash {
          background-image:
            linear-gradient(180deg, rgba(5, 5, 4, 0.50) 0%, rgba(5, 5, 4, 0.68) 45%, rgba(5, 5, 4, 0.86) 100%),
            url('assets/large-background.jpg');
        }
      }
      /* Hero: solid beige base; the dark photo texture (+ its beige tints) lives on .fourcee-hero-overlay so it can be masked. */
      .fourcee-hero-beige {
        background-color: #faf5ea;
      }
      /* The hero photo (dark slatted texture) is drawn untinted; the beige wash lives on .fourcee-hero-fade (phones/tablets, vertical) and
         .fourcee-hero-wash (lg+, horizontal), each 0% where the photo should read clearly. */
      .fourcee-hero-overlay {
        background-image: url('assets/mobile-background.jpg');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
      }
      @media (max-width: 767px) {
        .fourcee-hero-beige .fourcee-hero-beige-veil {
          opacity: 0.35 !important;
        }
        .fourcee-grain-lite {
          opacity: 0.12 !important;
        }
      }
      @media (min-width: 768px) {
        .fourcee-hero-overlay { background-image: url('assets/large-background.jpg'); }
      }
      @media (min-width: 1024px) {
        /* text sits in the right column: photo clear on the left (behind the ring), beige wash builds toward the copy on the right */
        .fourcee-hero-wash {
          background: linear-gradient(90deg, rgba(250,245,234,0) 0%, rgba(250,245,234,0) 38%, rgba(250,245,234,0.55) 50%, rgba(250,245,234,0.86) 60%, rgba(250,245,234,0.94) 100%);
        }
      }
      /* Logo: always-visible dual ink — dark pill + white glyphs + ink stroke for light AND dark */
      .fx-logo-negative {
        color: #faf5ea !important;
        -webkit-text-fill-color: #faf5ea !important;
        mix-blend-mode: normal !important;
        background: rgba(12, 11, 9, 0.92) !important;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        border: 1px solid rgba(200, 181, 143, 0.55) !important;
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        box-shadow:
          0 0 0 1px rgba(250, 245, 234, 0.35),
          0 0 0 2px rgba(12, 11, 9, 0.75),
          0 8px 28px rgba(0, 0, 0, 0.45);
        font-weight: 600;
        letter-spacing: 0.14em;
        text-shadow:
          0 0 1px rgba(12, 11, 9, 1),
          0 1px 2px rgba(0, 0, 0, 0.9),
          0 0 12px rgba(200, 181, 143, 0.25);
      }
      /* Crush EtherealShadow grain on mobile so cards stay readable */
      @media (max-width: 768px) {
        .fourcee-grain-lite {
          opacity: 0.12 !important;
        }
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
